<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #5568d8;
        }

        #message {
            margin-top: 20px;
            font-size: 15px;
            color: green;
            display: none;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔍 Search</h1>

        <p>Enter something to search</p>

        <!-- Formspree Form -->
        <form
            action="https://formspree.io/f/xjybwnqv"
            method="POST"
            id="searchForm"
        >

            <div class="search-box">

                <input
                    type="text"
                    name="search_query"
                    id="searchInput"
                    placeholder="Type your search..."
                    required
                >

                <button type="submit">
                    Search
                </button>

            </div>

            <!-- Extra information sent to Formspree -->
            <input type="hidden" name="page" value="Search Page">

        </form>

        <div id="message">
            ✅ Search submitted successfully!
        </div>

        <div class="result" id="result">
            <strong>Your Search:</strong>
            <span id="searchText"></span>
        </div>

    </div>


    <script>

        const form = document.getElementById("searchForm");
        const input = document.getElementById("searchInput");

        const message = document.getElementById("message");
        const result = document.getElementById("result");
        const searchText = document.getElementById("searchText");


        form.addEventListener("submit", function(event) {

            // Get typed search
            const value = input.value.trim();

            if (value === "") {
                event.preventDefault();
                return;
            }

            // Show search on page
            searchText.textContent = value;
            result.style.display = "block";

            message.style.display = "block";

            /*
             Form will continue submitting to Formspree.
             The search value will be sent as:

             search_query = whatever the user typed
            */

        });

    </script>

</body>
</html>
