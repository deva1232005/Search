<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .search-container {
            width: 90%;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            width: 100%;
        }

        .search-input {
            flex: 1;
            height: 55px;
            padding: 0 20px;
            font-size: 18px;
            border: 2px solid #222;
            border-right: none;
            border-radius: 30px 0 0 30px;
            outline: none;
        }

        .search-button {
            width: 120px;
            height: 55px;
            border: 2px solid #222;
            border-radius: 0 30px 30px 0;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .search-button:hover {
            background: #444;
        }

        @media (max-width: 500px) {
            .search-input {
                font-size: 15px;
            }

            .search-button {
                width: 90px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="search-container">

        <form
            class="search-form"
            action="https://formspree.io/f/xjybwnqv"
            method="POST"
        >

            <input
                type="text"
                name="search"
                class="search-input"
                placeholder="Search..."
                autocomplete="off"
                required
            >

            <button
                type="submit"
                class="search-button"
            >
                Search
            </button>

        </form>

    </div>

</body>
</html>
